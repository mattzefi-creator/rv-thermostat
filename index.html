<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RV</title>
<style>
/* Home: three big buttons with the last reading from each app. */
:root {
  --bg: #f1f1ee; --panel: #fcfcfb; --ink: #0b0b0b; --muted: #52514e; --line: #e1e0d9; --soft: #f1f0ec;
  --batt: #0ca30c; --batt-wash: #e3f4e3; --sun: #e8a200; --sun-wash: #fdf3d8; --heat: #d9480f; --heat-wash: #fde7dc;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111110; --panel: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --line: #2c2c2a; --soft: #232321;
    --batt-wash: #12260f; --sun: #f2b53a; --sun-wash: #2e2410; --heat: #ff7a3d; --heat-wash: #3a2015;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 480px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-size: 1.5rem; margin: 6px 2px 4px; font-weight: 700; letter-spacing: -.01em; }
.card {
  display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 16px;
  min-height: 116px; padding: 18px 18px 18px 20px; border-radius: 22px;
  background: var(--panel); box-shadow: 0 0 0 1px var(--line); color: inherit; text-decoration: none;
  transition: transform .1s;
}
.card:active { transform: scale(.985); }
.card:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.icon { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; }
.icon svg { width: 34px; height: 34px; }
.batt .icon { background: var(--batt-wash); color: var(--batt); }
.sun .icon { background: var(--sun-wash); color: var(--sun); }
.heat .icon { background: var(--heat-wash); color: var(--heat); }
.name { font-size: 1.3rem; font-weight: 700; }
.val { font-size: 1rem; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
.when { font-size: .8rem; color: var(--muted); }
.chev { color: var(--muted); font-size: 1.6rem; line-height: 1; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>RV</h1>

  <a class="card batt" href="battery.html">
    <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="16" height="11" rx="2"/><path d="M21 11v3M7 11v3M10 11v3"/></svg></div>
    <div><div class="name">Battery</div><div class="val" id="bVal">Tap to open</div><div class="when" id="bWhen"></div></div>
    <span class="chev" aria-hidden="true">›</span>
  </a>

  <a class="card sun" href="solar.html">
    <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></div>
    <div><div class="name">Solar</div><div class="val" id="sVal">Tap to open</div><div class="when" id="sWhen"></div></div>
    <span class="chev" aria-hidden="true">›</span>
  </a>

  <a class="card heat" href="thermostat.html">
    <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 10v6"/></svg></div>
    <div><div class="name">Thermostat</div><div class="val" id="tVal">Tap to open</div><div class="when" id="tWhen"></div></div>
    <span class="chev" aria-hidden="true">›</span>
  </a>
</main>
<script>
'use strict';
// Each app saves its last reading on this phone; show those here so the home screen is useful at a glance.
const $ = id => document.getElementById(id);
const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
function ago(t) {
  if (!t) return '';
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 90) return 'Updated just now';
  if (s < 5400) return 'Updated ' + Math.round(s / 60) + ' min ago';
  return 'Updated ' + new Date(t).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
}
function render() {
  const b = read('wc_last');
  if (b && b.soc != null) {
    const w = Math.round(Math.abs((b.current || 0) * (b.voltage || 0)));
    const flow = b.current > 0.3 ? `charging ${w} W` : b.current < -0.3 ? `using ${w} W` : 'resting';
    $('bVal').textContent = `${b.soc}% · ${flow}`; $('bWhen').textContent = ago(b.at);
  }
  const ctrls = read('vc_ctrls') || [], last = read('vc_last') || {};
  const rs = ctrls.map(c => last[c.id]).filter(r => r && r.solarW != null);
  if (rs.length) {
    const w = rs.reduce((t, r) => t + r.solarW, 0), y = rs.reduce((t, r) => t + (r.yieldWh || 0), 0);
    $('sVal').textContent = `${w} W · ${y >= 1000 ? (y / 1000).toFixed(1) + ' kWh' : y + ' Wh'} today`;
    $('sWhen').textContent = ago(Math.max(...rs.map(r => r.at)));
  }
  const t = read('et_last');
  if (t && t.inside != null) {
    const modes = { 0: 'off', 1: 'fan', 2: 'cool', 4: 'heat', 6: 'dry', 11: 'auto' };
    const running = t.running === 5 ? ', heating' : t.running === 3 ? ', cooling' : '';
    $('tVal').textContent = `${t.inside}°F inside · ${modes[t.mode] || 'mode ' + t.mode}${running}`;
    $('tWhen').textContent = ago(t.at);
  }
}
render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
</script>
</body>
</html>
